name: Refresh stock screener

# Single-stock F&O screener (Phase C). Independent of data.yml — it fetches the
# option chain + quotes + daily closes for every stock in stocks-universe.mjs
# and writes public/data/stocks/**. Heavier than the index job (~1 chain call
# per stock), so it runs hourly during market hours + once post-close rather
# than every 10 min. Manual runs via workflow_dispatch.
on:
  schedule:
    # Hourly at :15, 04:15–10:15 UTC (≈09:45–15:45 IST) Mon–Fri — covers the
    # session plus the post-close settlement snapshot. Off :00 for reliability.
    - cron: "15 4-10 * * 1-5"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Rebuild only this NSE symbol (on-demand refresh). Empty = full universe."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-stocks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Seed the previously published set on EVERY run. Two reasons:
      #  - single-symbol refresh: force_orphan below would otherwise drop the
      #    other ~156 files;
      #  - full runs: each stock's per-day ATM-IV history lives in its own JSON,
      #    and the build appends to it. Because stocks-data is republished as an
      #    orphan commit each run, seeding is the only thing carrying that
      #    history forward — without it IV rank could never accrue.
      - name: Seed from stocks-data
        run: |
          mkdir -p public/data/stocks
          if git clone --depth 1 --branch stocks-data \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" _seed 2>/dev/null; then
            cp _seed/*.json public/data/stocks/ 2>/dev/null || true
            rm -rf _seed
            echo "Seeded $(ls public/data/stocks | wc -l) files from stocks-data."
          else
            echo "No existing stocks-data branch to seed — will publish just this symbol."
          fi

      # Remember what the seed brought in. Because seeding now happens on EVERY
      # run, a build that aborts (expired token, upstream 403) would otherwise
      # leave the seeded files in place, satisfy the guard below and republish
      # stale data as a green run — a failure that looks like a success.
      # Which file carries this run's freshness signal. A FULL run stamps
      # index.json; a SINGLE-SYMBOL run deliberately does NOT (index.json's
      # `asOf` means "last full run", and buildOneSymbol must not forge it), so
      # for those we watch the per-stock file, which carries its own timestamp.
      #
      # Getting this wrong is silent: the guard below saw an unchanged
      # index.json on every single-symbol run and skipped the publish, so the
      # rebuild happened, wrote the file, and threw it away. Every on-demand
      # refresh — i.e. the in-app "Fetch latest news" button — was a no-op that
      # reported success.
      - name: Resolve freshness target
        id: target
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          # `fileSlug` in scripts/build-stocks.mjs — keep the two in step.
        run: |
          echo "file=$(node -e "const s=(process.env.SYMBOL||'').toUpperCase(); console.log(s ? s.replace(/[^A-Za-z0-9]/g,'_') + '.json' : 'index.json')")" >> "$GITHUB_OUTPUT"

      - name: Record seeded timestamp
        id: pre
        run: |
          F="public/data/stocks/${{ steps.target.outputs.file }}"
          if [ -f "$F" ]; then
            echo "asof=$(node -p "require('./$F').asOf")" >> "$GITHUB_OUTPUT"
          else
            echo "asof=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stock screener
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SYMBOL: ${{ github.event.inputs.symbol }}
        run: node scripts/build-stocks.mjs

      # Publish stock JSON to a dedicated, force-pushed data branch so the code
      # branch never accumulates ~150 rewritten files per run. force_orphan
      # replaces the branch with a single commit each time → no history growth.
      # The frontend reads stock data from this branch via raw.githubusercontent.
      # Publish only on data the build actually refreshed: the file must exist
      # AND its timestamp must have moved past the seeded one.
      - name: Guard — did the build produce FRESH data?
        id: check
        run: |
          F="public/data/stocks/${{ steps.target.outputs.file }}"
          if [ ! -f "$F" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stock data built ($F missing) — leaving stocks-data untouched."
            exit 0
          fi
          NOW=$(node -p "require('./$F').asOf")
          if [ "$NOW" = "${{ steps.pre.outputs.asof }}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build did not refresh the data (asOf still $NOW) — upstream fetch likely failed. Leaving stocks-data untouched."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Refreshed: ${{ steps.pre.outputs.asof }} -> $NOW"
          fi

      - name: Publish to stocks-data branch
        if: steps.check.outputs.ok == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/data/stocks
          publish_branch: stocks-data
          force_orphan: true
          commit_message: "stocks data (force-pushed, no history)"
