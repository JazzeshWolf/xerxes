name: Deploy to GitHub Pages

# Publishes dist/ to the `gh-pages` branch. Creating that branch auto-enables
# GitHub Pages (source: gh-pages) — no Settings changes and no Pages API
# permissions needed (the configure-pages/deploy-pages route fails on repos
# where the workflow token can't create the Pages site).
on:
  push:
    branches: ["claude/nifty-option-screener-93xv0y"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Match the Pages sub-path to the actual repo name automatically.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional on-demand stock-refresh proxy URL (repo variable). Empty =
          # stock Refresh re-pulls the last published snapshot (no live rebuild).
          VITE_STOCK_REFRESH_URL: ${{ vars.STOCK_REFRESH_URL }}
      - run: touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
