name: Send test alert

# Manual check that the Telegram secrets are wired up: Actions → "Send test
# alert" → Run workflow. The bot should reply "Xerxes alerts connected".
# A red run means the token or chat ID is wrong, or the bot was never started.
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Also send a mock stock + index alert (labelled MOCK)"
        type: boolean
        default: false
      eod:
        description: "Resend today's end-of-day report (contracts above the alert level at the close)"
        type: boolean
        default: false
      snapshot:
        description: "Send what passes the alert rules right now (from the last run), real data"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_MIN_CONV_STOCK: ${{ vars.ALERT_MIN_CONV_STOCK }}
          ALERT_MIN_ROM_STOCK: ${{ vars.ALERT_MIN_ROM_STOCK }}
          ALERT_MIN_DTE_STOCK: ${{ vars.ALERT_MIN_DTE_STOCK }}
          ALERT_MIN_CONV_INDEX: ${{ vars.ALERT_MIN_CONV_INDEX }}
          ALERT_MIN_ROM_INDEX: ${{ vars.ALERT_MIN_ROM_INDEX }}
          ALERT_MIN_CUSHION_INDEX: ${{ vars.ALERT_MIN_CUSHION_INDEX }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing or misnamed."
            exit 1
          fi
          if [ "${{ inputs.eod }}" = "true" ]; then
            scripts/alerts-state.sh pull
            node scripts/alerts.mjs --eod --state-dir _alerts
          elif [ "${{ inputs.snapshot }}" = "true" ]; then
            scripts/alerts-state.sh pull
            node scripts/alerts.mjs --snapshot --state-dir _alerts
          else
            node scripts/alerts.mjs --test
          fi
          if [ "${{ inputs.mock }}" = "true" ]; then node scripts/alerts.mjs --mock; fi
