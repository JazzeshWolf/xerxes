<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="description" content="Index options-seller screener: NIFTY / BANKNIFTY / SENSEX direction verdict, OI positioning and premium-sell candidates." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <title>Xerxes — Index Option Screener</title>
    <script>
      // Stamp the theme before first paint, otherwise a light-mode user gets a
      // dark flash while the bundle loads. Mirrors lib/theme.ts applyTheme().
      (function () {
        try {
          var m = localStorage.getItem("xerxes.theme");
          var t = m === "light" || m === "dark"
            ? m
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "light" ? "#f6f8fb" : "#0a0e14");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
